<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rahul Khan World</title>
    <style>
        /* Logo Styling */
        .logo-container { display: flex; justify-content: center; padding: 20px 0; }
        .logo-container img { max-width: 200px; height: auto; }

        body { text-align: center; font-family: sans-serif; }

        /* 10-and-10 Grid Layout */
        #trackButtons { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            margin-top: 20px; 
            justify-content: center; 
            max-width: 1400px; /* Forces 10 buttons per row */
            margin-left: auto;
            margin-right: auto;
        }

        .track-card { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 120px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 8px;
        }

        .track-card img { 
            width: 100px; 
            height: 100px; 
            object-fit: cover; 
            margin-bottom: 10px; 
            border-radius: 4px; 
        }

        .track-card button { 
            width: 100%; 
            padding: 8px; 
            cursor: pointer; 
            font-size: 14px;
        }
        
        .track-card button:hover { background-color: #f0f0f0; }

        /* Playing Track Display Modal */
        #activeTrackOverlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #activeTrackOverlay.show {
            display: flex;
        }

        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            max-width: 90%;
        }

        /* Container wrapping both the image and the GIF overlay */
        .image-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 15px auto;
        }

        .image-wrapper img.track-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        /* GIF overlay styled on top of the main track picture */
        .image-wrapper img.gif-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            pointer-events: none; /* Allows clicking through if needed */
            opacity: 0.8; /* Adjust transparency if you want to see the image beneath */
        }

        .modal-content h2 {
            margin: 0 0 15px 0;
            font-size: 22px;
            color: #333;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            border: none;
            background: none;
        }

        .close-btn:hover {
            color: #000;
        }

        /* Hidden Bottom-Right Toggle Button */
        #secretPageToggle {
            position: fixed;
            bottom: 5px;
            right: 5px;
            width: 25px;
            height: 25px;
            background-color: transparent;
            border: none;
            outline: none;
            opacity: 0.02; /* Nearly invisible */
            cursor: pointer;
            z-index: 9999;
        }

        #secretPageToggle:hover {
            opacity: 0.2; /* Slightly visible on hover so you can locate it easily */
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="main logo.jpg" alt="Rahul Khan Logo">
    </div>

    <h1>Welcome to Rahul Khan World</h1>
    <p>Selecting a track syncs it for everyone in real-time:</p>

    <div id="trackButtons"></div>

    <br><br>

    <audio id="audioPlayer" controls>
        <source id="audioSource" src="" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Overlay for Active Track -->
    <div id="activeTrackOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeOverlay">&times;</button>
            <div class="image-wrapper">
                <img id="overlayTrackImg" class="track-img" src="" alt="Active Track Image">
                <img src="squer.gif" class="gif-overlay" alt="Playing animation">
            </div>
            <h2 id="overlayTrackTitle">Now Playing</h2>
        </div>
    </div>

    <!-- Hidden Navigation Button -->
    <button id="secretPageToggle" title="Toggle Page"></button>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyD2H-Ccdm4fAq4qtgXqwVOAz4d7z115Ucw",
            authDomain: "rahulkhan-a4f12.firebaseapp.com",
            databaseURL: "https://rahulkhan-a4f12-default-rtdb.firebaseio.com",
            projectId: "rahulkhan-a4f12",
            storageBucket: "rahulkhan-a4f12.firebasestorage.app",
            messagingSenderId: "324760694486",
            appId: "1:324760694486:web:a57ca86603fd9911fc2377"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const trackRef = ref(db, 'currentTrack');

        const audioPlayer = document.getElementById("audioPlayer");
        const audioSource = document.getElementById("audioSource");
        const container = document.getElementById("trackButtons");
        const secretToggle = document.getElementById("secretPageToggle");

        const overlay = document.getElementById("activeTrackOverlay");
        const overlayImg = document.getElementById("overlayTrackImg");
        const overlayTitle = document.getElementById("overlayTrackTitle");
        const closeOverlay = document.getElementById("closeOverlay");

        let currentPage = 1;

        // Close overlay on click
        closeOverlay.onclick = () => {
            overlay.classList.remove("show");
        };

        // Close overlay if background dark area is clicked
        overlay.onclick = (e) => {
            if (e.target === overlay) {
                overlay.classList.remove("show");
            }
        };

        // Function to render 20 track buttons according to current page
        function loadPage(page) {
            container.innerHTML = "";
            const startTrack = (page - 1) * 20 + 1;
            const endTrack = page * 20;

            for (let i = startTrack; i <= endTrack; i++) {
                const card = document.createElement("div");
                card.className = "track-card";

                const img = document.createElement("img");
                img.src = "Track " + i + ".jpg";
                img.alt = "Track " + i;

                const btn = document.createElement("button");
                btn.innerHTML = "Track " + i;
                btn.onclick = () => set(trackRef, i.toString());

                card.appendChild(img);
                card.appendChild(btn);
                container.appendChild(card);
            }
        }

        // Toggle between Page 1 and Page 2 when clicking the hidden corner button
        secretToggle.onclick = () => {
            currentPage = currentPage === 1 ? 2 : 1;
            loadPage(currentPage);
        };

        // Initial Load
        loadPage(1);

        // Real-time sync listener
        onValue(trackRef, (snapshot) => {
            const trackNumber = snapshot.val();
            if (!trackNumber) return;

            // Update overlay image and title
            overlayImg.src = "Track " + trackNumber + ".jpg";
            overlayTitle.textContent = "Now Playing: Track " + trackNumber;
            overlay.classList.add("show");

            const newSource = trackNumber + ".mp3";
            if (audioSource.src.indexOf(newSource) === -1) {
                audioPlayer.pause();
                audioSource.src = newSource;
                audioPlayer.load();
                audioPlayer.play().catch(e => console.log("Playback interaction required"));
            } else {
                audioPlayer.currentTime = 0;
                audioPlayer.play().catch(e => console.log("Playback error"));
            }
        });
    </script>
</body>
</html>
